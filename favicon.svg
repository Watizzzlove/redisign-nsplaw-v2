<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded brand plum background -->
  <rect width="64" height="64" rx="14" fill="#5F1358" />
  
  <!-- Subtle architectural inner border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Monogram NSP with golden apostrophe -->
  <text x="29" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="-1" text-anchor="middle">
    NSP
  </text>
  <text x="50" y="33" font-family="Georgia, serif" font-weight="900" font-size="20" fill="#E5B972" text-anchor="middle">
    ’
  </text>
  
  <!-- Subtle classic pedestal line -->
  <line x1="14" y1="48" x2="50" y2="48" stroke="#E5B972" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" />
</svg>